# Builds the public documentation site (docs/ — Next.js + fumadocs) and, when
# configured, deploys it to its Railway service.
#
# Three jobs on purpose:
#   check   the drift guard. Regenerates the DO-NOT-EDIT reference pages and fails
#           if what is committed differs, then verifies every path, constant and
#           class the prose pages cite still exists. Runs first so a docs lie
#           fails against the commit that caused it.
#   build   `next build`, so a broken page fails here rather than on the host.
#   deploy  needs both; skips with a notice when Railway is not configured yet,
#           because a red X on every docs commit before setup is just noise.
#
# The path filter includes `custom_components/**` deliberately: a code change can
# change the generated reference, so a code change must be able to redeploy the
# docs — and must fail `check` if the generated pages were not regenerated.
# (`release.yml` is the workflow that versions and tags; this one never does.)
#
# ── What you set on GitHub ───────────────────────────────────────────────────
#   Settings → Secrets and variables → Actions
#
#   Secret    RAILWAY_TOKEN              a Railway project or account token
#   Variable  RAILWAY_DOCS_SERVICE       the service name, e.g. `docs`
#   Variable  RAILWAY_DOCS_ENVIRONMENT   optional, defaults to `production`
#
# Nothing in this file needs editing — that is why they are vars and secrets.
#
# ── What you set on the Railway SERVICE ──────────────────────────────────────
# Nothing. The deploy step uploads the `docs/` directory as the build context and
# `docs/Dockerfile` sits at the root of it, so no RAILWAY_DOCKERFILE_PATH and no
# root-directory setting are needed. Railway injects PORT; the image honours it.
#
# ── The simpler alternative ──────────────────────────────────────────────────
# Railway's native GitHub integration auto-deploys on push with no workflow and no
# token; service-level *watch paths* do the same filtering and the service root
# directory must then be set to `docs`. If you use that, delete the `deploy` job
# and keep `check` + `build`. Two mechanisms deploying one service is how you end
# up debugging which of them shipped.
name: Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "custom_components/**"
      - "scripts/docs_*.py"
      - "hacs.json"
      - "VERSION"
      - ".github/workflows/docs-deploy.yml"

permissions:
  contents: read

concurrency:
  # A docs deploy is not worth queueing — the newest push wins.
  group: docs
  cancel-in-progress: true

jobs:
  check:
    name: Drift guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Both scripts are standard-library only — no pip install, no lockfile.
      - name: Generated pages match the source
        run: python3 scripts/docs_generate.py --check

      - name: Every cited path and identifier still exists
        run: python3 scripts/docs_check_refs.py --verbose

  build:
    name: Build site
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm ci

      - run: npm run build

  deploy:
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Distinguishes "not set up yet" from "set up wrongly". A push should not go
      # red before the service exists; an explicit dispatch should, because the
      # person asking for a deploy needs to know it did not happen.
      - name: Check configuration
        id: config
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE: ${{ vars.RAILWAY_DOCS_SERVICE }}
        run: |
          if [ -n "$RAILWAY_TOKEN" ] && [ -n "$SERVICE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          [ -n "$RAILWAY_TOKEN" ] || missing="$missing RAILWAY_TOKEN(secret)"
          [ -n "$SERVICE" ] || missing="$missing RAILWAY_DOCS_SERVICE(variable)"
          echo "ready=false" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::Cannot deploy. Missing:$missing — see the header of this workflow."
            exit 1
          fi
          echo "::notice::Railway not configured yet (missing:$missing) — checked and built only, not deployed."

      - name: Deploy
        if: steps.config.outputs.ready == 'true'
        working-directory: docs
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli@4
          railway up \
            --service "${{ vars.RAILWAY_DOCS_SERVICE }}" \
            --environment "${{ vars.RAILWAY_DOCS_ENVIRONMENT || 'production' }}" \
            --ci
